<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>gnaveenkumar.com — Launching Soon 🚀</title>
<meta name="description" content="gnaveenkumar.com is under construction. Something out of this world is on its way." />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --deep-space: #030014;
    --nebula-purple: #7b2ff7;
    --nebula-pink: #f107a3;
    --nebula-cyan: #00e5ff;
    --star-gold: #ffd166;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--deep-space);
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    color: #fff;
  }

  /* ---------- Star canvas ---------- */
  #space {
    position: fixed;
    inset: 0;
    z-index: 0;
  }

  /* ---------- Nebula clouds ---------- */
  .nebula {
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.45;
    z-index: 1;
    animation: nebulaDrift 26s ease-in-out infinite alternate;
    pointer-events: none;
  }
  .nebula.one {
    width: 55vmax; height: 55vmax;
    top: -20vmax; left: -15vmax;
    background: radial-gradient(circle, var(--nebula-purple), transparent 65%);
  }
  .nebula.two {
    width: 50vmax; height: 50vmax;
    bottom: -18vmax; right: -12vmax;
    background: radial-gradient(circle, var(--nebula-pink), transparent 65%);
    animation-delay: -8s;
    animation-duration: 32s;
  }
  .nebula.three {
    width: 40vmax; height: 40vmax;
    top: 30%; left: 55%;
    background: radial-gradient(circle, var(--nebula-cyan), transparent 65%);
    opacity: 0.22;
    animation-delay: -15s;
    animation-duration: 38s;
  }
  @keyframes nebulaDrift {
    0%   { transform: translate(0, 0) scale(1) rotate(0deg); }
    50%  { transform: translate(6vmax, -4vmax) scale(1.15) rotate(10deg); }
    100% { transform: translate(-4vmax, 5vmax) scale(0.95) rotate(-8deg); }
  }

  /* ---------- Shooting stars ---------- */
  .shooting-star {
    position: fixed;
    width: 3px; height: 3px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 8px 2px rgba(255,255,255,0.8);
    z-index: 2;
    opacity: 0;
    animation: shoot 6s linear infinite;
    pointer-events: none;
  }
  .shooting-star::after {
    content: '';
    position: absolute;
    top: 50%; right: 0;
    width: 140px; height: 1.5px;
    transform: translateY(-50%);
    background: linear-gradient(to left, rgba(255,255,255,0.9), transparent);
  }
  .shooting-star:nth-child(1) { top: 12%; left: 65%; animation-delay: 1s; }
  .shooting-star:nth-child(2) { top: 30%; left: 85%; animation-delay: 3.5s; animation-duration: 7s; }
  .shooting-star:nth-child(3) { top: 6%;  left: 35%; animation-delay: 6s;  animation-duration: 8s; }
  @keyframes shoot {
    0%   { opacity: 0; transform: translate(0, 0) rotate(-25deg); }
    3%   { opacity: 1; }
    12%  { opacity: 0; transform: translate(-45vw, 22vh) rotate(-25deg); }
    100% { opacity: 0; transform: translate(-45vw, 22vh) rotate(-25deg); }
  }

  /* ---------- Orbiting planets ---------- */
  .orbit-system {
    position: fixed;
    top: 50%; left: 50%;
    z-index: 2;
    pointer-events: none;
  }
  .orbit {
    position: absolute;
    top: 50%; left: 50%;
    border: 1px dashed rgba(255,255,255,0.08);
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }
  .orbit.o1 { width: 78vmin; height: 78vmin; animation: spin 40s linear infinite; }
  .orbit.o2 { width: 108vmin; height: 108vmin; animation: spin 70s linear infinite reverse; }
  .orbit.o3 { width: 140vmin; height: 140vmin; animation: spin 110s linear infinite; }
  @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }

  .planet {
    position: absolute;
    border-radius: 50%;
    top: -14px; left: 50%;
  }
  .planet.mars {
    width: 28px; height: 28px;
    background: radial-gradient(circle at 32% 30%, #ffb56b, #d95d39 60%, #7a2510);
    box-shadow: 0 0 18px rgba(217, 93, 57, 0.7);
  }
  .planet.ice {
    width: 20px; height: 20px;
    background: radial-gradient(circle at 32% 30%, #d8fdff, #59c8ff 60%, #1a52a8);
    box-shadow: 0 0 16px rgba(89, 200, 255, 0.8);
  }
  .planet.ringed {
    width: 34px; height: 34px;
    background: radial-gradient(circle at 32% 30%, #ffe9b0, #d9a53c 60%, #8a5a13);
    box-shadow: 0 0 20px rgba(217, 165, 60, 0.7);
  }
  .planet.ringed::before {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    width: 64px; height: 18px;
    border: 2px solid rgba(255, 226, 158, 0.75);
    border-radius: 50%;
    transform: translate(-50%, -50%) rotate(-24deg);
  }

  /* ---------- Astronaut ---------- */
  .astronaut {
    position: fixed;
    top: 14%;
    right: 9%;
    width: clamp(90px, 13vw, 170px);
    z-index: 3;
    animation: floatSpace 9s ease-in-out infinite;
    filter: drop-shadow(0 0 24px rgba(0, 229, 255, 0.35));
    pointer-events: none;
  }
  @keyframes floatSpace {
    0%   { transform: translateY(0) rotate(-6deg); }
    25%  { transform: translateY(-26px) rotate(4deg); }
    50%  { transform: translateY(-8px) rotate(10deg); }
    75%  { transform: translateY(-30px) rotate(-2deg); }
    100% { transform: translateY(0) rotate(-6deg); }
  }

  /* ---------- Rocket ---------- */
  .rocket {
    position: fixed;
    bottom: -140px;
    left: 8%;
    width: clamp(60px, 8vw, 110px);
    z-index: 3;
    animation: rocketFly 14s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes rocketFly {
    0%   { transform: translate(0, 0) rotate(0deg); opacity: 0; }
    8%   { opacity: 1; }
    50%  { transform: translate(28vw, -68vh) rotate(12deg); opacity: 1; }
    62%  { opacity: 0; }
    100% { transform: translate(45vw, -110vh) rotate(16deg); opacity: 0; }
  }
  .flame {
    transform-origin: 50% 0%;
    animation: flicker 0.12s ease-in-out infinite alternate;
  }
  @keyframes flicker {
    from { transform: scaleY(0.85) scaleX(0.92); }
    to   { transform: scaleY(1.15) scaleX(1.05); }
  }

  /* ---------- Content ---------- */
  .content {
    position: relative;
    z-index: 5;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    gap: 26px;
  }

  .domain-badge {
    font-size: clamp(0.8rem, 1.6vw, 1rem);
    letter-spacing: 0.45em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.75);
    border: 1px solid rgba(255,255,255,0.25);
    padding: 10px 26px 10px 32px;
    border-radius: 999px;
    backdrop-filter: blur(6px);
    background: rgba(255,255,255,0.04);
    animation: fadeSlideDown 1.2s ease both, borderPulse 3s ease-in-out infinite;
  }
  @keyframes borderPulse {
    0%, 100% { border-color: rgba(255,255,255,0.25); box-shadow: 0 0 0 rgba(0,229,255,0); }
    50%      { border-color: rgba(0,229,255,0.7);   box-shadow: 0 0 24px rgba(0,229,255,0.25); }
  }

  h1 {
    font-size: clamp(2.4rem, 8vw, 6.5rem);
    font-weight: 900;
    line-height: 1.05;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    background: linear-gradient(90deg, var(--nebula-cyan), var(--nebula-purple), var(--nebula-pink), var(--star-gold), var(--nebula-cyan));
    background-size: 300% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    animation: shineFlow 6s linear infinite, fadeSlideUp 1.2s 0.2s ease both;
  }
  @keyframes shineFlow { to { background-position: 300% center; } }

  /* Wave animation per letter of "IN PROGRESS" */
  .wave span {
    display: inline-block;
    animation: wave 2.2s ease-in-out infinite;
  }
  @keyframes wave {
    0%, 100% { transform: translateY(0); }
    30%      { transform: translateY(-0.18em); }
  }

  .tagline {
    font-size: clamp(1rem, 2.4vw, 1.4rem);
    color: rgba(255,255,255,0.82);
    max-width: 640px;
    animation: fadeSlideUp 1.2s 0.45s ease both;
  }
  .tagline .typing {
    display: inline-block;
    border-right: 2px solid var(--nebula-cyan);
    white-space: nowrap;
    overflow: hidden;
    vertical-align: bottom;
    animation: typing 4s steps(38) 1s both, caretBlink 0.8s step-end infinite;
  }
  @keyframes typing { from { width: 0; } to { width: 100%; } }
  @keyframes caretBlink { 50% { border-color: transparent; } }

  /* ---------- Progress bar ---------- */
  .progress-wrap {
    width: min(520px, 82vw);
    animation: fadeSlideUp 1.2s 0.7s ease both;
  }
  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 0.85rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.65);
    margin-bottom: 10px;
  }
  .progress-track {
    height: 14px;
    border-radius: 999px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    overflow: hidden;
    position: relative;
  }
  .progress-fill {
    height: 100%;
    width: 72%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--nebula-cyan), var(--nebula-purple), var(--nebula-pink));
    background-size: 200% auto;
    animation: fillGrow 2.6s 1s cubic-bezier(0.22, 1, 0.36, 1) both, shineFlow 3s linear infinite;
    position: relative;
  }
  .progress-fill::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
    animation: shimmer 1.6s linear infinite;
  }
  @keyframes fillGrow { from { width: 0; } }
  @keyframes shimmer {
    from { transform: translateX(-100%); }
    to   { transform: translateX(100%); }
  }

  /* ---------- Countdown-ish pulsing dots ---------- */
  .status {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.95rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.7);
    animation: fadeSlideUp 1.2s 0.9s ease both;
  }
  .status .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #38ef7d;
    box-shadow: 0 0 12px #38ef7d;
    animation: pulseDot 1.4s ease-in-out infinite;
  }
  @keyframes pulseDot {
    0%, 100% { transform: scale(1);   opacity: 1; }
    50%      { transform: scale(1.6); opacity: 0.55; }
  }

  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeSlideDown {
    from { opacity: 0; transform: translateY(-30px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ---------- Footer ---------- */
  footer {
    position: fixed;
    bottom: 18px;
    width: 100%;
    text-align: center;
    z-index: 5;
    font-size: 0.8rem;
    letter-spacing: 0.15em;
    color: rgba(255,255,255,0.45);
    animation: fadeSlideUp 1.2s 1.1s ease both;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>

  <canvas id="space"></canvas>

  <div class="nebula one"></div>
  <div class="nebula two"></div>
  <div class="nebula three"></div>

  <div class="shooting-star"></div>
  <div class="shooting-star"></div>
  <div class="shooting-star"></div>

  <div class="orbit-system">
    <div class="orbit o1"><div class="planet ice"></div></div>
    <div class="orbit o2"><div class="planet mars"></div></div>
    <div class="orbit o3"><div class="planet ringed"></div></div>
  </div>

  <!-- Astronaut -->
  <svg class="astronaut" viewBox="0 0 200 220" aria-hidden="true">
    <!-- tether -->
    <path d="M20 10 Q 60 60 92 92" stroke="rgba(255,255,255,0.35)" stroke-width="2" fill="none" stroke-dasharray="5 6"/>
    <!-- backpack -->
    <rect x="55" y="70" width="90" height="95" rx="18" fill="#c9d6e5"/>
    <!-- body -->
    <ellipse cx="100" cy="130" rx="42" ry="52" fill="#f2f6fa"/>
    <!-- arms -->
    <path d="M62 115 Q 30 130 38 160 Q 44 172 56 164 Q 70 150 74 138 Z" fill="#e3eaf2"/>
    <path d="M138 115 Q 172 128 166 158 Q 160 172 148 164 Q 132 150 128 138 Z" fill="#e3eaf2"/>
    <!-- legs -->
    <path d="M80 172 Q 74 200 84 208 Q 96 214 98 198 L 96 172 Z" fill="#e3eaf2"/>
    <path d="M120 172 Q 128 200 118 208 Q 106 214 104 198 L 106 172 Z" fill="#e3eaf2"/>
    <!-- helmet -->
    <circle cx="100" cy="78" r="38" fill="#f2f6fa"/>
    <circle cx="100" cy="78" r="30" fill="#0a1a3c"/>
    <ellipse cx="90" cy="68" rx="10" ry="6" fill="rgba(255,255,255,0.5)" transform="rotate(-25 90 68)"/>
    <!-- chest panel -->
    <rect x="86" y="118" width="28" height="18" rx="4" fill="#9fb3c8"/>
    <circle cx="93" cy="127" r="3" fill="#ff5d5d"/>
    <circle cx="102" cy="127" r="3" fill="#ffd166"/>
    <circle cx="110" cy="127" r="3" fill="#38ef7d"/>
  </svg>

  <!-- Rocket -->
  <svg class="rocket" viewBox="0 0 120 220" aria-hidden="true">
    <g class="flame">
      <path d="M60 170 Q 45 200 60 218 Q 75 200 60 170 Z" fill="#ffb347"/>
      <path d="M60 176 Q 52 196 60 210 Q 68 196 60 176 Z" fill="#ff5e3a"/>
    </g>
    <path d="M60 5 Q 92 55 88 120 L 32 120 Q 28 55 60 5 Z" fill="#e8edf3"/>
    <path d="M60 5 Q 76 33 82 70 L 38 70 Q 44 33 60 5 Z" fill="#ff4d6d"/>
    <circle cx="60" cy="92" r="14" fill="#0a1a3c" stroke="#9fb3c8" stroke-width="4"/>
    <path d="M32 118 L 10 158 L 34 148 Z" fill="#ff4d6d"/>
    <path d="M88 118 L 110 158 L 86 148 Z" fill="#ff4d6d"/>
    <rect x="40" y="120" width="40" height="18" rx="6" fill="#c9d6e5"/>
  </svg>

  <main class="content">
    <div class="domain-badge">gnaveenkumar.com</div>

    <h1>
      Work<br />
      <span class="wave" id="wave-text">In&nbsp;Progress</span>
    </h1>

    <p class="tagline">
      <span class="typing">Something out of this world is being built here…</span><br />
      Strap in — launch sequence initiated. 🚀
    </p>

    <div class="progress-wrap">
      <div class="progress-label">
        <span>Building</span>
        <span id="progress-pct">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>

    <div class="status">
      <span class="dot"></span> Systems Online — Launching Soon
    </div>
  </main>

  <footer>© <span id="year"></span> gnaveenkumar.com · made among the stars ✨</footer>

<script>
  // ---------- Twinkling parallax starfield ----------
  const canvas = document.getElementById('space');
  const ctx = canvas.getContext('2d');
  let stars = [], w, h;
  let mouseX = 0, mouseY = 0;

  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    const count = Math.min(420, Math.floor((w * h) / 3200));
    stars = Array.from({ length: count }, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      r: Math.random() * 1.6 + 0.3,
      depth: Math.random() * 0.9 + 0.1,          // parallax layer
      tw: Math.random() * Math.PI * 2,           // twinkle phase
      tws: Math.random() * 0.05 + 0.01,          // twinkle speed
      vy: Math.random() * 0.06 + 0.01            // slow drift
    }));
  }
  window.addEventListener('resize', resize);
  resize();

  window.addEventListener('mousemove', (e) => {
    mouseX = (e.clientX / w - 0.5) * 2;
    mouseY = (e.clientY / h - 0.5) * 2;
  });

  function draw() {
    ctx.clearRect(0, 0, w, h);
    for (const s of stars) {
      s.tw += s.tws;
      s.y += s.vy;
      if (s.y > h + 2) s.y = -2;
      const alpha = 0.35 + Math.abs(Math.sin(s.tw)) * 0.65;
      const px = s.x + mouseX * 22 * s.depth;
      const py = s.y + mouseY * 22 * s.depth;
      ctx.beginPath();
      ctx.arc(px, py, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  draw();

  // ---------- Per-letter wave for "IN PROGRESS" ----------
  const waveEl = document.getElementById('wave-text');
  waveEl.innerHTML = waveEl.textContent
    .split('')
    .map((ch, i) => ch.trim() === ''
      ? '&nbsp;'
      : `<span style="animation-delay:${i * 0.07}s">${ch}</span>`)
    .join('');

  // ---------- Progress counter ----------
  const TARGET = 72;
  const pctEl = document.getElementById('progress-pct');
  const start = performance.now();
  function countUp(now) {
    const t = Math.min((now - start - 1000) / 2600, 1); // sync with fillGrow (1s delay, 2.6s)
    if (t < 0) { requestAnimationFrame(countUp); return; }
    const eased = 1 - Math.pow(1 - t, 3);
    pctEl.textContent = Math.round(eased * TARGET) + '%';
    if (t < 1) requestAnimationFrame(countUp);
  }
  requestAnimationFrame(countUp);

  document.getElementById('year').textContent = new Date().getFullYear();
</script>
</body>
</html>
