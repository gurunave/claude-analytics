<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>gnaveenkumar.com — build in progress</title>
<meta name="description" content="gnaveenkumar.com is compiling. Work in progress — check back soon." />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0e14;
    --panel: #0f1520;
    --panel-border: #1e2a3a;
    --green: #3ddc84;
    --cyan: #4dd0e1;
    --yellow: #ffd866;
    --red: #ff6188;
    --purple: #ab9df2;
    --text: #d8dee9;
    --muted: #5c6b7f;
    --font-mono: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', 'SF Mono', Consolas, 'Courier New', monospace;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-mono);
  }

  /* ---------- Code rain canvas ---------- */
  #rain {
    position: fixed;
    inset: 0;
    z-index: 0;
    opacity: 0.16;
  }

  /* ---------- Subtle CRT scanlines + vignette ---------- */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: 10;
    pointer-events: none;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 3px),
      radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.55) 100%);
  }

  /* ---------- Floating code symbols ---------- */
  .float-sym {
    position: fixed;
    z-index: 1;
    font-size: clamp(1.2rem, 3vw, 2.4rem);
    color: var(--muted);
    opacity: 0;
    animation: floatUp 14s linear infinite;
    pointer-events: none;
    user-select: none;
  }
  .float-sym:nth-child(1) { left: 6%;  animation-delay: 0s;   color: #2e5d46; }
  .float-sym:nth-child(2) { left: 16%; animation-delay: 3s;   color: #2b4d63; }
  .float-sym:nth-child(3) { left: 78%; animation-delay: 1.5s; color: #4d4368; }
  .float-sym:nth-child(4) { left: 88%; animation-delay: 5s;   color: #5d5433; }
  .float-sym:nth-child(5) { left: 68%; animation-delay: 8s;   color: #2e5d46; }
  .float-sym:nth-child(6) { left: 28%; animation-delay: 10s;  color: #5d3346; }
  @keyframes floatUp {
    0%   { transform: translateY(105vh) rotate(0deg); opacity: 0; }
    8%   { opacity: 0.7; }
    92%  { opacity: 0.7; }
    100% { transform: translateY(-8vh) rotate(24deg); opacity: 0; }
  }

  /* ---------- Layout ---------- */
  .wrap {
    position: relative;
    z-index: 5;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(18px, 3.5vh, 36px);
    padding: 20px 16px 56px;
  }

  /* ---------- Glitch headline ---------- */
  .headline {
    position: relative;
    font-size: clamp(1.5rem, 4.6vw, 3.4rem);
    font-weight: 800;
    letter-spacing: 0.14em;
    color: var(--text);
    text-transform: uppercase;
    animation: fadeDown 0.9s ease both;
    white-space: nowrap;
  }
  .headline .accent { color: var(--green); }
  .headline::before,
  .headline::after {
    content: attr(data-text);
    position: absolute;
    inset: 0;
    overflow: hidden;
    opacity: 0.85;
  }
  .headline::before {
    color: var(--cyan);
    animation: glitchA 3.2s infinite steps(1);
  }
  .headline::after {
    color: var(--red);
    animation: glitchB 3.2s infinite steps(1);
  }
  @keyframes glitchA {
    0%, 88%, 100% { clip-path: inset(0 0 100% 0); transform: none; }
    89% { clip-path: inset(12% 0 60% 0); transform: translate(-4px, -2px); }
    91% { clip-path: inset(55% 0 20% 0); transform: translate(3px, 1px); }
    93% { clip-path: inset(80% 0 4% 0);  transform: translate(-2px, 0); }
    95% { clip-path: inset(30% 0 48% 0); transform: translate(4px, 2px); }
  }
  @keyframes glitchB {
    0%, 88%, 100% { clip-path: inset(0 0 100% 0); transform: none; }
    90% { clip-path: inset(60% 0 18% 0); transform: translate(4px, 1px); }
    92% { clip-path: inset(8% 0 72% 0);  transform: translate(-3px, -1px); }
    94% { clip-path: inset(42% 0 38% 0); transform: translate(2px, 2px); }
  }

  /* ---------- Terminal window ---------- */
  .terminal {
    width: min(760px, 94vw);
    background: rgba(15, 21, 32, 0.92);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    box-shadow:
      0 24px 70px rgba(0, 0, 0, 0.6),
      0 0 0 1px rgba(61, 220, 132, 0.06),
      0 0 42px rgba(61, 220, 132, 0.07);
    backdrop-filter: blur(8px);
    overflow: hidden;
    animation: fadeUp 0.9s 0.15s ease both, terminalGlow 5s ease-in-out infinite;
  }
  @keyframes terminalGlow {
    0%, 100% { box-shadow: 0 24px 70px rgba(0,0,0,0.6), 0 0 42px rgba(61,220,132,0.07); }
    50%      { box-shadow: 0 24px 70px rgba(0,0,0,0.6), 0 0 60px rgba(77,208,225,0.13); }
  }

  .term-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
    background: #131b28;
    border-bottom: 1px solid var(--panel-border);
  }
  .term-bar .dot { width: 12px; height: 12px; border-radius: 50%; }
  .term-bar .dot.r { background: #ff5f57; }
  .term-bar .dot.y { background: #febc2e; }
  .term-bar .dot.g { background: #28c840; }
  .term-bar .title {
    flex: 1;
    text-align: center;
    font-size: 0.78rem;
    color: var(--muted);
    letter-spacing: 0.08em;
  }

  .term-body {
    padding: 18px 20px 22px;
    min-height: 320px;
    max-height: 46vh;
    overflow-y: auto;
    font-size: clamp(0.78rem, 1.9vw, 0.95rem);
    line-height: 1.75;
    scrollbar-width: thin;
    scrollbar-color: var(--panel-border) transparent;
  }
  .term-body::-webkit-scrollbar { width: 6px; }
  .term-body::-webkit-scrollbar-thumb { background: var(--panel-border); border-radius: 3px; }

  .line { white-space: pre-wrap; word-break: break-word; }
  .prompt  { color: var(--green); font-weight: 700; }
  .cmd     { color: var(--text); }
  .out     { color: var(--muted); }
  .ok      { color: var(--green); }
  .warn    { color: var(--yellow); }
  .err     { color: var(--red); }
  .info    { color: var(--cyan); }
  .accent2 { color: var(--purple); }

  .cursor {
    display: inline-block;
    width: 0.55em;
    height: 1.05em;
    margin-left: 2px;
    background: var(--green);
    vertical-align: text-bottom;
    animation: blink 0.9s step-end infinite;
    box-shadow: 0 0 8px rgba(61, 220, 132, 0.8);
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ---------- Status bar (VS Code style) ---------- */
  .statusbar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 6;
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 6px 16px;
    background: #10161f;
    border-top: 1px solid var(--panel-border);
    font-size: 0.74rem;
    color: var(--muted);
    animation: fadeUp 0.9s 0.5s ease both;
    overflow: hidden;
    white-space: nowrap;
  }
  .statusbar .item { display: flex; align-items: center; gap: 6px; }
  .statusbar .grow { flex: 1; }
  .statusbar .live {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50%      { transform: scale(1.5); opacity: 0.5; }
  }

  @keyframes fadeUp   { from { opacity: 0; transform: translateY(24px);  } to { opacity: 1; transform: none; } }
  @keyframes fadeDown { from { opacity: 0; transform: translateY(-24px); } to { opacity: 1; transform: none; } }

  @media (max-width: 560px) {
    .statusbar .hide-sm { display: none; }
    .headline { white-space: normal; text-align: center; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>

  <canvas id="rain"></canvas>

  <span class="float-sym">&lt;/&gt;</span>
  <span class="float-sym">{ }</span>
  <span class="float-sym">=&gt;</span>
  <span class="float-sym">;</span>
  <span class="float-sym">#!</span>
  <span class="float-sym">[ ]</span>

  <div class="wrap">
    <h1 class="headline" data-text="< WORK IN PROGRESS />">&lt;&nbsp;WORK&nbsp;<span class="accent">IN&nbsp;PROGRESS</span>&nbsp;/&gt;</h1>

    <div class="terminal">
      <div class="term-bar">
        <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
        <span class="title">naveen@gnaveenkumar.com: ~/website — bash</span>
      </div>
      <div class="term-body" id="term"></div>
    </div>
  </div>

  <div class="statusbar">
    <span class="item"><span class="live"></span> building…</span>
    <span class="item hide-sm">⎇ main*</span>
    <span class="item hide-sm">UTF-8</span>
    <span class="grow"></span>
    <span class="item hide-sm">Ln 42, Col 7</span>
    <span class="item">localhost:9000</span>
    <span class="item">© <span id="year"></span> gnaveenkumar.com</span>
  </div>

<script>
  // ---------------- Code rain ----------------
  const canvas = document.getElementById('rain');
  const ctx = canvas.getContext('2d');
  const GLYPHS = '01<>{}[]/=;()#$&*+-!?abcdefx';
  let cols = [], fontSize = 14, W, H;

  function sizeRain() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    const n = Math.floor(W / fontSize);
    cols = Array.from({ length: n }, () => Math.random() * -H / fontSize);
  }
  window.addEventListener('resize', sizeRain);
  sizeRain();

  setInterval(() => {
    ctx.fillStyle = 'rgba(10, 14, 20, 0.12)';
    ctx.fillRect(0, 0, W, H);
    ctx.font = fontSize + 'px monospace';
    for (let i = 0; i < cols.length; i++) {
      const ch = GLYPHS[Math.floor(Math.random() * GLYPHS.length)];
      ctx.fillStyle = Math.random() > 0.94 ? '#4dd0e1' : '#3ddc84';
      ctx.fillText(ch, i * fontSize, cols[i] * fontSize);
      cols[i] = (cols[i] * fontSize > H && Math.random() > 0.975) ? 0 : cols[i] + 1;
    }
  }, 60);

  // ---------------- Terminal script ----------------
  const term = document.getElementById('term');
  const PROMPT = '<span class="prompt">naveen@web</span><span class="out">:</span><span class="info">~/website</span><span class="prompt">$ </span>';

  // step types: cmd (typed), out (printed), progress (animated bar), spinner, pause, clearcursor
  const SCRIPT = [
    { t: 'cmd',  text: 'whoami' },
    { t: 'out',  html: '<span class="accent2">naveen kumar</span> <span class="out">— engineer · builder · caffeine-powered</span>' },
    { t: 'pause', ms: 500 },

    { t: 'cmd',  text: 'git clone https://github.com/naveen/next-big-thing.git' },
    { t: 'out',  html: '<span class="out">Cloning into </span><span class="info">\'gnaveenkumar.com\'</span><span class="out">…</span>' },
    { t: 'out',  html: '<span class="out">remote: counting ideas: 100% (∞/∞), done.</span>' },
    { t: 'pause', ms: 450 },

    { t: 'cmd',  text: 'npm install ambition@latest' },
    { t: 'spinner', ms: 1500, label: 'resolving dependencies' },
    { t: 'out',  html: '<span class="ok">+ ambition@2.0.26</span> <span class="out">added 1 package (and removed all excuses)</span>' },
    { t: 'pause', ms: 500 },

    { t: 'cmd',  text: 'npm run build' },
    { t: 'out',  html: '<span class="out">&gt; gnaveenkumar.com@1.0.0 build</span>' },
    { t: 'progress', ms: 2600, label: 'compiling awesomeness' },
    { t: 'out',  html: '<span class="warn">WARN</span> <span class="out">greatness takes a little time — please stand by</span>' },
    { t: 'out',  html: '<span class="ok">✔</span> <span class="out">modules bundled</span>   <span class="ok">✔</span> <span class="out">pixels polished</span>   <span class="ok">✔</span> <span class="out">bugs politely escorted out</span>' },
    { t: 'pause', ms: 550 },

    { t: 'cmd',  text: 'systemctl status website' },
    { t: 'out',  html: '<span class="ok">●</span> website.service — <span class="warn">WORK IN PROGRESS</span>' },
    { t: 'out',  html: '<span class="out">   Active: </span><span class="ok">activating</span><span class="out"> (building) since today — ETA: soon™</span>' },
    { t: 'pause', ms: 550 },

    { t: 'cmd',  text: 'echo "$MESSAGE"' },
    { t: 'out',  html: '<span class="info">Something great is compiling here. Come back for v1.0 🚀</span>' },
  ];

  const sleep = (ms) => new Promise(r => setTimeout(r, ms));
  const scroll = () => { term.scrollTop = term.scrollHeight; };

  function newLine(html = '') {
    const div = document.createElement('div');
    div.className = 'line';
    div.innerHTML = html;
    term.appendChild(div);
    scroll();
    return div;
  }

  async function typeCmd(text) {
    const line = newLine(PROMPT);
    const span = document.createElement('span');
    span.className = 'cmd';
    line.appendChild(span);
    const cur = document.createElement('span');
    cur.className = 'cursor';
    line.appendChild(cur);
    for (const ch of text) {
      span.textContent += ch;
      scroll();
      await sleep(28 + Math.random() * 55);
    }
    await sleep(300);
    cur.remove();
  }

  async function runProgress(ms, label) {
    const line = newLine();
    const width = 24, steps = 30;
    for (let i = 0; i <= steps; i++) {
      const filled = Math.round((i / steps) * width);
      const pct = Math.round((i / steps) * 100);
      line.innerHTML =
        '<span class="out">' + label + ' </span>' +
        '<span class="ok">[' + '█'.repeat(filled) + '░'.repeat(width - filled) + ']</span>' +
        '<span class="info"> ' + pct + '%</span>';
      scroll();
      await sleep(ms / steps);
    }
  }

  async function runSpinner(ms, label) {
    const frames = ['⠋','⠙','⠹','⠸','⠼','⠴','⠦','⠧','⠇','⠏'];
    const line = newLine();
    const t0 = Date.now();
    let i = 0;
    while (Date.now() - t0 < ms) {
      line.innerHTML = '<span class="info">' + frames[i++ % frames.length] + '</span><span class="out"> ' + label + '…</span>';
      await sleep(70);
    }
    line.innerHTML = '<span class="ok">✔</span><span class="out"> ' + label + ' — done</span>';
    scroll();
  }

  async function run() {
    await sleep(900);
    for (const step of SCRIPT) {
      if (step.t === 'cmd')      await typeCmd(step.text);
      else if (step.t === 'out')      { newLine(step.html); await sleep(180); }
      else if (step.t === 'pause')    await sleep(step.ms);
      else if (step.t === 'progress') await runProgress(step.ms, step.label);
      else if (step.t === 'spinner')  await runSpinner(step.ms, step.label);
    }
    // resting prompt with blinking cursor
    newLine(PROMPT + '<span class="cursor"></span>');
  }
  run();

  document.getElementById('year').textContent = new Date().getFullYear();
</script>
</body>
</html>
