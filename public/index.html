<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Claude usage analytics</title>
    <link rel="stylesheet" href="/styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%232a78d6'/%3E%3Crect x='3' y='8' width='2.5' height='5' rx='1' fill='white'/%3E%3Crect x='6.75' y='5' width='2.5' height='8' rx='1' fill='white'/%3E%3Crect x='10.5' y='3' width='2.5' height='10' rx='1' fill='white'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div class="wrap">
      <header class="top">
        <div>
          <h1>Claude usage analytics</h1>
          <p class="subtitle" id="subtitle">Reading local session transcripts…</p>
        </div>
      </header>

      <nav class="tabs" id="nav" aria-label="Sections"></nav>

      <div class="controls" id="controls">
        <div class="seg" id="range" role="group" aria-label="Time range">
          <button data-days="7">7 days</button>
          <button data-days="30">30 days</button>
          <button data-days="90">90 days</button>
          <button data-days="0" aria-pressed="true">All time</button>
        </div>
        <span class="source-chip" id="source-chip" hidden></span>
        <span class="spacer"></span>
        <div class="seg" id="theme" role="group" aria-label="Theme">
          <button data-theme="light">Light</button>
          <button data-theme="dark">Dark</button>
          <button data-theme="system" aria-pressed="true">System</button>
        </div>
      </div>

      <main id="app"><div class="empty">Loading…</div></main>

      <footer class="foot" id="foot"></footer>
    </div>

    <div id="tooltip" role="status" aria-live="polite"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
